[pytest]
# The app's async SQLAlchemy engine (app/database.py) is created once at
# import time and pools asyncpg connections tied to whichever event loop is
# running when they're first used. pytest-asyncio's default is a fresh event
# loop per test function, which breaks that pool ("RuntimeError: Event loop
# is closed") the moment more than one async test runs in a session. One
# shared loop for the whole run fixes it — this only affects test collection,
# not the real app (which only ever has the one event loop uvicorn owns).
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
